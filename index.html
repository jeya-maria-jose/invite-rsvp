<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f0">
  <meta name="description" content="You're invited to Jose & Chandni's engagement. Join us at La Selva Beach on December 20, 2026, and kindly RSVP.">
  <title>Invite | Jose & Chandni</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#rsvp-heading">Skip to RSVP</a>
  <main class="page">
      <section class="invitation" aria-label="Jose and Chandni's engagement invitation">
        <img class="invitation-art" src="assets/invitation.png" width="768" height="1024" alt="Join us for the engagement of Jose and Chandni on Sunday, December 20, 2026, 10 AM to 1 PM, at La Selva Beach, 138 Alta Drive, Santa Cruz. A sunny seaside invitation framed by white blossoms and gold.">
      </section>

      <section class="card" aria-labelledby="rsvp-heading">
        <h1 id="rsvp-heading" tabindex="-1">RSVP</h1>
        <form id="rsvp-form">
          <label for="guest-name">Your name <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="guest-name" name="name" maxlength="100" autocomplete="name" placeholder="Your full name" required>
          <fieldset>
            <legend>Meal preference <span class="required-mark" aria-hidden="true">*</span></legend>
            <div class="choices">
              <label class="choice">
                <input type="radio" name="meal" value="Veg" required>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 18C2 8 12 4 20 4c0 8-4 16-12 14M4 21 16 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Vegetarian</span>
              </label>
              <label class="choice">
                <input type="radio" name="meal" value="Non Veg" required>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3v6m3-6v6M11 3v6M5 9c0 4 6 4 6 0M8 12v9M19 3c-3 2-4 6-4 10h4m0-10v18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Non-vegetarian</span>
              </label>
            </div>
          </fieldset>
          <button type="submit" id="submit-button"><span id="submit-label">RSVP</span></button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>

        <div id="success" class="success" hidden>
          <div class="check" aria-hidden="true">&#10003;</div>
          <h2 id="success-heading" tabindex="-1">RSVP request sent</h2>
          <p>Guest-list delivery is unconfirmed.</p>
          <button type="button" class="secondary" id="another">Submit another response</button>
        </div>
      </section>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
